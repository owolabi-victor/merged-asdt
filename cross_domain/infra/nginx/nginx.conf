worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream ditto-gateway {
        server ditto-gateway:8080;
    }

    server {
        listen 8080;

        # Health / liveness — no auth required
        location /health {
            proxy_pass         http://ditto-gateway;
            proxy_set_header   Host $host;
        }

        # Ditto REST API — basic auth, then pre-authenticate
        location / {
            auth_basic           "DITTO";
            auth_basic_user_file /etc/nginx/nginx.htpasswd;

            proxy_pass         http://ditto-gateway;
            proxy_set_header   Host $host;

            # Tell the Ditto gateway who authenticated.
            # Policy subjects use "nginx:<username>" as the identity.
            proxy_set_header   x-ditto-pre-authenticated "nginx:$remote_user";

            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
