events {
    worker_connections 1024;
}

http {
    # ── Upstream servers ─────────────────────────────────────────────────
    upstream twin_api {
        server twin-api:8080;
    }
    upstream scientist_ui {
        server scientist-ui:8501;
    }
    upstream farmer_ui {
        server farmer-ui:8502;
    }

    # ── Main server ──────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ── Twin API ─────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://twin_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://twin_api;
        }

        location /docs {
            proxy_pass http://twin_api;
        }

        location /openapi.json {
            proxy_pass http://twin_api;
        }

        # ── WebSocket for live updates ───────────────────────────────────
        location /ws/ {
            proxy_pass http://twin_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # ── Scientist Dashboard ──────────────────────────────────────────
        location /scientist/ {
            proxy_pass http://scientist_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ── Farmer Dashboard ─────────────────────────────────────────────
        location /farmer/ {
            proxy_pass http://farmer_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ── Streamlit internal endpoints ─────────────────────────────────
        location /_stcore/ {
            proxy_pass http://scientist_ui/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Root — landing page ──────────────────────────────────────────
        location / {
            proxy_pass http://twin_api;
            proxy_set_header Host $host;
        }
    }
}
